spring.application.name=air-quality-monitor

# Secrets and DB settings come from the .env file in the repository root
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# POSTGRES_HOST is "db" inside docker compose, localhost when running from the IDE
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# The schema is created by Flyway migrations (src/main/resources/db/migration),
# Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Test area: Wroclaw city center and radius
app.area.latitude=51.11
app.area.longitude=17.03
app.area.radius-km=10

# Scheduled fetching from external APIs (disabled in tests)
app.fetch.enabled=true
app.sensor-community.fetch-interval=PT5M
# Airly: 100 requests/day, one run = 1 + number of installations requests (16 in Wroclaw)
app.airly.fetch-interval=PT6H
app.airly.max-installations=16
# LookO2: the API blocks the token if called more often than once per 30 minutes
app.looko2.fetch-interval=PT30M
# GIOS: hourly values published with a delay, one run = about 12 requests (limit 1500 per minute)
app.gios.fetch-interval=PT30M

# Validation: a measurement is wrong if the sensor sent the same PM2.5 and PM10 this many times in a row
app.validation.stuck-count=6

# Detection: starting values, to be tuned later on collected data
app.detection.interval=PT5M
app.detection.window-hours=12
app.detection.min-samples=6
app.detection.z-threshold=3
app.detection.neighbor-radius-km=3
app.detection.min-neighbors=3
# the sensor must be at least this times the neighbour median
app.detection.background-factor=1.5
